<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Голосовой тест</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 16px;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#111}.wrap{max-width:600px;margin:auto}h1{font-size:28px}.hint{color:#666;line-height:1.45}.card{background:#fff;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 3px 16px #0001}#sentence{font-size:42px;font-weight:600;text-align:center;min-height:64px;margin:24px 0 12px}#number{text-align:center;color:#777;font-size:16px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:12px;font-size:18px;font-weight:600;background:#111;color:#fff;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.98)}#listen.active{background:#c62828}#status{margin-top:18px;text-align:center;font-weight:600;min-height:24px}#heard{margin-top:10px;padding:12px;background:#f2f2f7;border-radius:12px;color:#555;min-height:44px}</style></head><body><div class="wrap"><h1>Голосовой тест</h1><div class="hint">Нажми «Слушать» и скажи <b>«Дальше»</b> или <b>«Назад»</b>.</div><div class="card"><div id="number">Предложение 1 из 3</div><div id="sentence">你好。</div><button id="listen">Слушать</button><button id="prev">Назад</button><button id="next">Дальше</button><div id="status">Готов</div><div id="heard">Услышано: —</div></div></div><script>(()=>{const s=["你好。","你好吗？","我很好。"],e=id=>document.getElementById(id);let i=0;const se=e("sentence"),ne=e("number"),st=e("status"),he=e("heard"),lb=e("listen");function render(){se.textContent=s[i];ne.textContent=`Предложение ${i+1} из ${s.length}`}function next(){i=Math.min(i+1,s.length-1);render()}function prev(){i=Math.max(i-1,0);render()}e("next").addEventListener("click",next);e("prev").addEventListener("click",prev);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){st.textContent="Safari не дал доступ к распознаванию речи.";lb.disabled=true;return}const r=new SR();r.lang="ru-RU";r.continuous=false;r.interimResults=false;r.maxAlternatives=3;lb.addEventListener("click",()=>{try{r.start();lb.classList.add("active");lb.textContent="Слушаю…";st.textContent="Говори команду"}catch(x){}});r.onresult=ev=>{const t=ev.results[0][0].transcript.trim(),l=t.toLowerCase();he.textContent="Услышано: "+t;if(l.includes("дальше")){next();st.textContent="Команда: ДАЛЬШЕ"}else if(l.includes("назад")){prev();st.textContent="Команда: НАЗАД"}else st.textContent="Команда не распознана"};r.onerror=ev=>st.textContent="Ошибка: "+ev.error;r.onend=()=>{lb.classList.remove("active");lb.textContent="Слушать"};render()})();</script></body></html>
