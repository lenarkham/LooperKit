<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LooperKit Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            border-radius: 15px;
            background: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:active {
            background-color: #0051a8;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #8e8e93;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LooperKit Player</h1>
    <p id="display-text">Режим: Ожидание запуска</p>
    
    <button id="start-btn" onclick="initPlayer()">Активировать плеер</button>
    
    <div class="status" id="status-text">Нажмите кнопку, чтобы подключить AirPods</div>
</div>

<script>
    let audioCtx = null;

    function initPlayer() {
        if (audioCtx) return;

        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = 0.0;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;
            whiteNoise.connect(audioCtx.destination);
            whiteNoise.start();

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('status-text').innerText = 'Плеер активен! Используйте жесты AirPods.';
            document.getElementById('display-text').innerText = 'Текущий трек: №1';

            setupMediaSession();
        } catch (e) {
            alert('Ошибка запуска аудио: ' + e);
        }
    }

    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'LooperKit Control',
                artist: 'My AirPods Player'
            });

            navigator.mediaSession.setActionHandler('nexttrack', () => {
                actionNext();
            });

            navigator.mediaSession.setActionHandler('previoustrack', () => {
                translateToRussian();
            });
            
            navigator.mediaSession.setActionHandler('play', () => { if(audioCtx) audioCtx.resume(); });
            navigator.mediaSession.setActionHandler('pause', () => { });
        } else {
            document.getElementById('status-text').innerText = 'Браузер не поддерживает MediaSession API';
        }
    }

    let trackNumber = 1;

    function actionNext() {
        trackNumber++;
        document.getElementById('display-text').innerText = 'Текущий трек: №' + trackNumber;
        console.log('Переключено на трек №' + trackNumber);
    }

    function translateToRussian() {
        document.getElementById('display-text').innerText = 'Переведено на РУССКИЙ язык';
        console.log('Включен русский язык');
    }
</script>

</body>
</html>
