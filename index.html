<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大雁 · Тренажёр аудирования</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 90%;
            padding: 30px;
            border-radius: 20px;
            background: #1e1e1e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 20px;
        }
        .nav-links {
            color: #007aff;
            text-decoration: none;
            margin: 0 10px;
            font-size: 16px;
        }
        h1 {
            font-size: 28px;
            margin: 10px 0;
        }
        h2 {
            font-size: 20px;
            color: #34c759;
            margin-bottom: 30px;
        }
        .loading {
            font-size: 22px;
            color: #eaeaea;
            margin: 40px 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #2c2c2e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.96);
            background-color: #3a3a3c;
        }
        .btn-active {
            background-color: #007aff;
        }
        .speed-title {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 10px;
        }
        .speed-options {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }
        .speed-btn {
            background: none;
            border: 1px solid #3a3a3c;
            color: #8e8e93;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .speed-btn.active {
            border-color: #007aff;
            color: #007aff;
        }
        .hints {
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.6;
            border-top: 1px solid #2c2c2e;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <strong>Глава</strong><br><br>
        <a href="#" class="nav-links">← пред.</a> — / — <a href="#" class="nav-links">след. →</a>
    </div>

    <h1>大雁 · 听力训练</h1>
    <h2>Тренажёр аудирования</h2>

    <div class="loading" id="status-display">Нажмите «Дальше» для старта</div>

    <div class="controls">
        <button class="btn" onclick="togglePause()">⏸ Пауза</button>
        <button class="btn btn-active" onclick="goNext()">▶ Дальше</button>
        <button class="btn" onclick="getTranslation()">🇷🇺 Перевод</button>
    </div>

    <div class="speed-title">Скорость китайского</div>
    <div class="speed-options">
        <button class="speed-btn active" onclick="setSpeed(1.0)">1.0×</button>
        <button class="speed-btn" onclick="setSpeed(0.85)">0.85×</button>
        <button class="speed-btn" onclick="setSpeed(0.75)">0.75×</button>
        <button class="speed-btn" onclick="setSpeed(0.6)">0.6×</button>
    </div>

    <div class="hints">
        Пробел — дальше · T — перевод · P/Enter — пауза/пуск · ←/→ — назад/вперёд<br>
        Фраза повторяется по кругу, пока не нажмёте «Дальше»
    </div>
</div>

<!-- Аудиоэлемент для воспроизведения файлов из этого репозитория -->
<audio id="main-audio" loop></audio>

<script>
    const audio = document.getElementById('main-audio');
    
    // Список файлов прямо из корня этого рабочего репозитория
    const playlist = ['A.mp3', 'B.mp3', 'C.mp3', 'test.mp3'];
    let currentTrackIndex = -1;

    function goNext() {
        currentTrackIndex++;
        if (currentTrackIndex >= playlist.length) {
            currentTrackIndex = 0; 
        }

        document.getElementById('status-display').innerText = "Играет файл: " + playlist[currentTrackIndex];
        
        audio.src = playlist[currentTrackIndex];
        audio.play().catch(err => console.log("Ошибка: ", err));

        // Включаем AirPods при первом же клике
        setupAirPodsMedia();
    }

    function togglePause() {
        if (audio.paused) {
            audio.play();
            document.getElementById('status-display').innerText = "Играет файл: " + playlist[currentTrackIndex];
        } else {
            audio.pause();
            document.getElementById('status-display').innerText = "⏸ Пауза";
        }
    }

    function getTranslation() {
        document.getElementById('status-display').innerText = "Перевод для файла " + playlist[currentTrackIndex];
    }

    function setSpeed(speed) {
        audio.playbackRate = speed;
        const buttons = document.querySelectorAll('.speed-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    }

    // НАСТРОЙКА ЖЕСТОВ AIRPODS
    function setupAirPodsMedia() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Тренажёр аудирования',
                artist: 'Файл: ' + playlist[currentTrackIndex]
            });

            // Тройной тап (Вперед) — запускает функцию "Дальше"
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                goNext();
            });

            // Двойной тап (Назад) — запускает функцию "Перевод"
            navigator.mediaSession.setActionHandler('previoustrack', () => {
                getTranslation();
            });

            navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
            navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
        }
    }

    // Кнопки клавиатуры для ПК
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); goNext(); }
        if (e.key === 't' || e.key === 'е') { getTranslation(); }
        if (e.key === 'p' || e.key === 'з' || e.key === 'Enter') { togglePause(); }
    });
</script>

</body>
</html>
